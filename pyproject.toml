[project]
name = "agentui"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "João Paulo Figueira", email = "joao.figueira@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpcore2[asyncio]>=2.12.0",
    "nicegui>=4.0.0",
    "pydantic[email,timezone]==2.14.3",
    "python-dotenv==1.2.4",
    "psycopg[binary]==3.3.8",
    "starlette==1.10.0",
    "pandas>=3.0.5",
    "openpyxl>=3.1.5",
    "latex2mathml>=3.81.0",
    "asyncer>=0.0.18",
    "haystack-ai>=3.1.0",
    "pgvector-haystack>=6.6.0",
    "mcp-haystack>=1.5.1",
    "pypdf>=7.0.0",
    "nicemvvm@git+https://github.com/joaofig/nicemvvm.git",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.uv.sources]
nicemvvm = { path = "../nicemvvm", editable = true }
